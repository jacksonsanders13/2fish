<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* Layout: social-feed style. Sticky blue top bar, composer box, then post cards with an avatar header,
   a category cover band, a fundraiser-style progress tracker and a full-width green help button. */
:root{
  --bg:#eef1f5;
  --surface:#ffffff;
  --ink:#14212b;
  --muted:#65717c;
  --line:#dde3ea;
  --brand:#1b5fd1;
  --brand-ink:#ffffff;
  --brand-soft:#e8f1ff;
  --go:#12a05c;
  --go-ink:#ffffff;
  --go-soft:#e2f5ea;
  --warn:#f2a630;
  --warn-soft:#fdf1dc;
  --font:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a;--surface:#1b2229;--ink:#e7ecf1;--muted:#9aa6b2;--line:#2b343d;
    --brand:#4d8cf0;--brand-ink:#ffffff;--brand-soft:#1d2c44;--go:#2fbf76;--go-ink:#05210f;--go-soft:#173426;
    --warn:#f2b04a;--warn-soft:#3a2c14;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a;--surface:#1b2229;--ink:#e7ecf1;--muted:#9aa6b2;--line:#2b343d;
  --brand:#4d8cf0;--brand-ink:#ffffff;--brand-soft:#1d2c44;--go:#2fbf76;--go-ink:#05210f;--go-soft:#173426;
  --warn:#f2b04a;--warn-soft:#3a2c14;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
a{color:var(--brand)}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.topbar .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.logo .mark{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo b{font-weight:900;font-size:24px;letter-spacing:-.02em}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:7px 12px}
.search input{border:0;background:transparent;color:#fff;width:100%;outline:none}
.search input::placeholder{color:rgba(255,255,255,.8)}
.topbtn{margin-left:auto;border:0;background:#fff;color:var(--brand);font-weight:800;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}

.wrap{max-width:680px;margin:0 auto;padding:12px 16px 72px;display:grid;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.banner[hidden]{display:none}

/* composer */
.composer{padding:12px;display:grid;gap:10px}
.composer .row1{display:flex;gap:10px;align-items:center}
.composer .fake{flex:1;text-align:left;border:0;background:var(--bg);border-radius:999px;padding:11px 16px;color:var(--muted);cursor:pointer;font-size:16px}
.composer .row2{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.qbtn{flex:1;min-width:92px;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px}
.qbtn:hover{background:var(--bg)}

/* location + stats */
.loc{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loc label{font-weight:800;font-size:14px}
.loc input{width:92px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 4px}
.stats div{display:grid}
.stats b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stats .o b{color:var(--brand)} .stats .p b{color:var(--warn)} .stats .d b{color:var(--go)}

nav.tabs{display:flex;gap:6px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

/* post cards */
.feed{display:grid;gap:12px}
.post{overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:12px 12px 8px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none;font-size:17px}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:800}
.who small{color:var(--muted);font-size:13px}
.status{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.status.open{background:var(--brand-soft);color:var(--brand)}
.status.pledged{background:var(--warn-soft);color:var(--ink)}
.status.done{background:var(--go-soft);color:var(--go)}
.pbody{padding:0 12px 10px;display:grid;gap:6px}
.pbody h3{margin:0;font-size:19px;font-weight:900;line-height:1.25;text-wrap:balance}
.pbody p{margin:0;max-width:65ch}
.cover{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;color:#fff;font-weight:800}
.cover .cn{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.95}
.cover .due{font-size:14px;background:rgba(0,0,0,.18);border-radius:999px;padding:3px 10px}
.cover .due.urgent{background:#fff;color:#7a4700}
.cover svg{opacity:.9}
.track{padding:12px 12px 4px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--go)}
.steps{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.steps .on{color:var(--ink)}
.ways{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 2px;font-size:13px}
.way{background:var(--bg);border-radius:8px;padding:4px 9px;color:var(--muted);font-weight:600}
.hnote{margin:6px 12px 0;padding:8px 10px;background:var(--go-soft);border-radius:10px;font-size:14px}
.pa{display:flex;gap:8px;padding:10px 12px 12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink);flex:1;min-width:140px;font-size:16px}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.soft{background:var(--bg);border-color:var(--bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ex{font-size:11px;font-weight:800;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}

/* form */
form.post-form{padding:16px;display:grid;gap:14px}
form.post-form h2{margin:0;font-size:20px;font-weight:900}
.field{display:grid;gap:5px}
.field label,.flabel{font-weight:800;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.safety{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.err{color:#c62828;font-size:14px;min-height:1em;font-weight:700}
.section-h{font-size:17px;font-weight:900;margin:6px 0 0}

dialog{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:18px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,20,30,.5)}
dialog h2{font-size:21px;font-weight:900;margin:0 0 4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:9;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (max-width:420px){.search{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="fish" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M46 20 L45 7 L68 17 Z"/><path d="M48 41 L45 53 L66 43 Z"/>
      <path d="M30 30 L11 16 L18 30 L11 44 Z"/>
      <path d="M30 30 C42 13 72 10 94 30 C72 50 42 47 30 30 Z"/>
      <path d="M74 16 Q67 30 74 44" fill="none"/>
      <circle cx="83" cy="28" r="1.6" stroke-width="3.6"/>
    </g>
    <symbol id="logo" viewBox="0 0 120 120">
      <use href="#fish" transform="translate(9,8) scale(.88)"/>
      <use href="#fish" transform="translate(111,60) scale(-.88,.88)"/>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="in">
    <a class="logo" href="#needs" aria-label="2fish home">
      <span class="mark"><svg width="32" height="32" style="fill:#fff;stroke:#14212b"><use href="#logo"/></svg></span>
      <b>2fish</b>
    </a>
    <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search needs" autocomplete="off"></label>
    <button class="topbtn" type="button" data-go="post">+ Post</button>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>

  <section id="view-needs" class="feed" style="gap:12px">
    <div class="box composer">
      <div class="row1">
        <div class="av" id="meAv" style="background:var(--brand)">?</div>
        <button class="fake" type="button" data-go="post">What do you need help with?</button>
      </div>
      <div class="row2">
        <button class="qbtn" type="button" data-quick="Baby">Baby items</button>
        <button class="qbtn" type="button" data-quick="Food">Groceries</button>
        <button class="qbtn" type="button" data-quick="Clothing">Clothing</button>
      </div>
    </div>

    <div class="box loc">
      <label for="zip">Your ZIP</label>
      <input id="zip" inputmode="numeric" maxlength="5" placeholder="27615" autocomplete="postal-code">
      <div class="chips" role="group" aria-label="How far">
        <button class="chip" data-range="zip" aria-pressed="false">My ZIP</button>
        <button class="chip" data-range="area" aria-pressed="true">Nearby</button>
        <button class="chip" data-range="all" aria-pressed="false">Anywhere</button>
      </div>
    </div>

    <div class="box stats" id="stats"></div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="true" data-tab="needs">Feed</button>
      <button role="tab" aria-selected="false" data-tab="mine">My activity</button>
    </nav>
    <div class="filters" id="catFilters" role="group" aria-label="Category"></div>
    <div class="feed" id="feed"></div>
  </section>

  <section id="view-mine" class="feed" hidden>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="false" data-tab="needs">Feed</button>
      <button role="tab" aria-selected="true" data-tab="mine">My activity</button>
    </nav>
    <h2 class="section-h">Needs I posted</h2>
    <div class="feed" id="mineFeed"></div>
    <h2 class="section-h">Needs I'm helping with</h2>
    <div class="feed" id="helpFeed"></div>
  </section>

  <section id="view-post" hidden>
    <form class="box post-form" id="postForm" novalidate>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2>Post a need</h2>
        <button class="btn soft" type="button" data-go="needs">Cancel</button>
      </div>
      <div class="field">
        <label for="f-title">What do you need?</label>
        <input id="f-title" maxlength="80" placeholder="Size 4 diapers">
      </div>
      <div class="two">
        <div class="field"><label for="f-cat">Category</label><select id="f-cat"></select></div>
        <div class="field"><label for="f-by">Needed by</label><input id="f-by" type="date"></div>
      </div>
      <div class="field">
        <label for="f-note">Tell your story</label>
        <textarea id="f-note" rows="3" maxlength="400" placeholder="A little about your situation, plus sizes or quantity so neighbors pick the right thing."></textarea>
      </div>
      <div class="two">
        <div class="field"><label for="f-zip">ZIP code</label><input id="f-zip" inputmode="numeric" maxlength="5" placeholder="27615"></div>
        <div class="field"><label for="f-area">Neighborhood (optional)</label><input id="f-area" maxlength="40" placeholder="North Raleigh"></div>
      </div>
      <div class="field">
        <label for="f-name">First name or nickname</label>
        <input id="f-name" maxlength="24" placeholder="Jess">
        <span class="hint">Leave it blank to post as "A neighbor".</span>
      </div>
      <div class="field">
        <span class="flabel">How can neighbors get it to you?</span>
        <label class="check"><input type="checkbox" id="f-inperson" checked> Drop off in person at a public spot</label>
        <input id="f-spot" maxlength="60" placeholder="Meeting spot, e.g. North Regional Library lobby">
        <label class="check"><input type="checkbox" id="f-wish"> Buy it from my wishlist</label>
        <input id="f-wishurl" maxlength="300" placeholder="https://www.amazon.com/hz/wishlist/ls/..." hidden>
      </div>
      <div class="safety">Never put your home address in a post. Pick a public meeting spot, or use a wishlist so the store ships to you privately.</div>
      <div class="err" id="postErr" role="alert"></div>
      <button class="btn go" type="submit" id="postBtn">Post my need</button>
    </form>
  </section>
</main>

<dialog id="helpDlg" aria-labelledby="helpTitle">
  <form method="dialog" id="helpForm">
    <h2 id="helpTitle">Help a neighbor</h2>
    <p id="helpWhat" style="margin:0;color:var(--muted)"></p>
    <div class="opts" id="helpOpts"></div>
    <div class="field">
      <label for="h-note">Note to them (optional)</label>
      <input id="h-note" maxlength="140" placeholder="I can drop off Saturday morning">
    </div>
    <div class="err" id="helpErr" role="alert"></div>
    <div class="pa" style="padding:6px 0 0;justify-content:flex-end">
      <button class="btn soft" type="button" id="helpCancel">Cancel</button>
      <button class="btn go" type="submit" id="helpConfirm">Count me in</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  const CATS = ["Baby","Food","Clothing","Household","School","Hygiene","Other"];
  const CAT_COLOR = { Baby:"#2f7de1", Food:"#e07a1f", Clothing:"#8a4fd6", Household:"#2a9d8f", School:"#d64570", Hygiene:"#1fa2c9", Other:"#5b6b7a" };
  const AV_COLORS = ["#1b5fd1","#12a05c","#e07a1f","#8a4fd6","#d64570","#2a9d8f","#c2410c","#0e7490"];
  const state = { needs: [], me: null, range: "area", cat: "All", q: "", tab: "needs", db: null, canWrite: true, isOwner: false };
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  let localId = store.get("2fish-local-id");
  if (!localId) { localId = "local-" + Math.random().toString(36).slice(2, 10); store.set("2fish-local-id", localId); }
  state.me = localId;

  const safeUrl = u => { try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch(e) { return null; } };
  const zipOk = z => /^\d{5}$/.test(z || "");
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const daysUntil = iso => { if (!iso) return null; return Math.round((new Date(iso + "T00:00:00") - today()) / 86400000); };
  const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); if (m < 60) return m <= 1 ? "just now" : m + "m"; const h = Math.round(m/60); if (h < 24) return h + "h"; return Math.round(h/24) + "d"; };
  const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
  function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800); }
  function banner(msg){ const b = $("#banner"); if (!msg) { b.hidden = true; return; } b.textContent = msg; b.hidden = false; }

  function previewNeeds(){
    const now = Date.now(); const inDays = n => { const d = today(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
    return [
      { id:"p1", title:"Size 4 diapers", category:"Baby", note:"Single mom of two. Any brand works, a box or two would get us through the month.", zip:"27615", area:"North Raleigh", name:"Jess", neededBy:inDays(2), inPerson:true, spot:"North Regional Library lobby", wishUrl:"", status:"open", posterId:"x1", createdAt:now-3*3600e3, example:true },
      { id:"p2", title:"Winter coat, boys 10/12", category:"Clothing", note:"My son outgrew his coat. Gently used is great.", zip:"27609", area:"Midtown", name:"Marcus", neededBy:inDays(6), inPerson:true, spot:"Church lobby on Six Forks", wishUrl:"https://www.amazon.com/hz/wishlist/ls/EXAMPLE", status:"pledged", helper:{ id:"x9", method:"wishlist", note:"Ordered, arriving Thursday" }, posterId:"x2", createdAt:now-26*3600e3, example:true },
      { id:"p3", title:"Groceries for the week", category:"Food", note:"Between paychecks. Canned goods, rice, peanut butter.", zip:"27604", area:"", name:"", neededBy:inDays(1), inPerson:true, spot:"Food Lion parking lot, Capital Blvd", wishUrl:"", status:"open", posterId:"x3", createdAt:now-50*60e3, example:true },
      { id:"p4", title:"School supplies for 3rd grade", category:"School", note:"Pencils, glue sticks, a backpack if anyone has one.", zip:"27616", area:"Brier Creek", name:"Ana", neededBy:"", inPerson:false, spot:"", wishUrl:"https://www.amazon.com/hz/wishlist/ls/EXAMPLE2", status:"done", helper:{ id:"x8", method:"wishlist", note:"" }, posterId:"x4", createdAt:now-4*86400e3, example:true }
    ];
  }

  function myZip(){ return ($("#zip").value || "").trim(); }
  function inRange(n){
    const z = myZip();
    if (state.range === "all" || !zipOk(z)) return true;
    if (state.range === "zip") return n.zip === z;
    return (n.zip || "").slice(0,3) === z.slice(0,3);
  }
  function matchesQ(n){ if (!state.q) return true; const s = (n.title + " " + (n.note||"") + " " + (n.area||"") + " " + (n.category||"")).toLowerCase(); return s.includes(state.q); }
  const visible = () => state.needs.filter(n => inRange(n) && matchesQ(n) && (state.cat === "All" || n.category === state.cat));

  function renderStats(){
    const v = state.needs.filter(inRange);
    const s = $("#stats"); s.replaceChildren();
    [["o", v.filter(n => n.status === "open").length, "Open needs"],["p", v.filter(n => n.status === "pledged").length, "Being helped"],["d", v.filter(n => n.status === "done").length, "Received"]].forEach(([c,num,label]) => {
      const d = el("div", c); d.append(el("b", null, String(num)), el("span", null, label)); s.append(d);
    });
  }
  function renderCatFilters(){
    const box = $("#catFilters"); box.replaceChildren();
    ["All", ...CATS].forEach(c => {
      const b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", String(state.cat === c));
      b.addEventListener("click", () => { state.cat = c; renderAll(); }); box.append(b);
    });
  }

  function avatar(name, seed){
    const a = el("div","av", (name || "N").trim().charAt(0).toUpperCase());
    a.style.background = AV_COLORS[hash(seed || name || "n") % AV_COLORS.length];
    return a;
  }

  function fishIcon(color){
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg"); s.setAttribute("width","34"); s.setAttribute("height","34"); s.setAttribute("aria-hidden","true");
    s.style.fill = color; s.style.stroke = "#fff";
    const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#logo"); s.append(u); return s;
  }

  function card(n){
    const c = el("article", "box post");
    const mine = n.posterId === state.me;
    const helping = n.helper && n.helper.id === state.me;

    const ph = el("div","ph");
    ph.append(avatar(n.name || "Neighbor", n.posterId));
    const who = el("div","who");
    const nm = el("b", null, n.name || "A neighbor");
    if (n.example) nm.append(el("span","ex","Example"));
    who.append(nm, el("small", null, [n.area, n.zip].filter(Boolean).join(" · ") + (n.createdAt ? " · " + ago(n.createdAt) : "")));
    ph.append(who, el("span", "status " + (n.status || "open"), n.status === "done" ? "Received" : n.status === "pledged" ? "Being helped" : "Open"));
    c.append(ph);

    const pb = el("div","pbody");
    pb.append(el("h3", null, n.title));
    if (n.note) pb.append(el("p", null, n.note));
    c.append(pb);

    const cover = el("div","cover"); cover.style.background = CAT_COLOR[n.category] || CAT_COLOR.Other;
    const left = el("div"); left.style.cssText = "display:flex;align-items:center;gap:10px";
    left.append(fishIcon(CAT_COLOR[n.category] || CAT_COLOR.Other), el("span","cn", n.category || "Other"));
    cover.append(left);
    const du = daysUntil(n.neededBy);
    if (n.neededBy && n.status !== "done") cover.append(el("span", "due" + (du != null && du <= 2 ? " urgent" : ""), du < 0 ? "Past due" : du === 0 ? "Needed today" : du === 1 ? "Needed tomorrow" : "By " + fmtDate(n.neededBy)));
    c.append(cover);

    const tr = el("div","track");
    const bar = el("div","bar"); const fillEl = el("i");
    fillEl.style.width = n.status === "done" ? "100%" : n.status === "pledged" ? "60%" : "12%";
    bar.append(fillEl);
    const steps = el("div","steps");
    const lvl = n.status === "done" ? 2 : n.status === "pledged" ? 1 : 0;
    ["Posted","Helper found","Received"].forEach((t,i) => steps.append(el("span", i <= lvl ? "on" : null, t)));
    tr.append(bar, steps); c.append(tr);

    const ways = el("div","ways");
    if (n.inPerson) ways.append(el("span","way","Drop off: " + (n.spot || "public spot")));
    const wu = safeUrl(n.wishUrl);
    if (wu) ways.append(el("span","way","Wishlist"));
    if (ways.childElementCount) c.append(ways);
    if (n.helper && n.status !== "open" && n.helper.note) c.append(el("div","hnote","Helper: " + n.helper.note));

    const pa = el("div","pa");
    if (!mine && n.status === "open") { const b = el("button","btn go","I'll help"); b.type="button"; b.disabled = !state.canWrite; b.addEventListener("click", () => openHelp(n)); pa.append(b); }
    if (wu && n.status !== "done") { const a = el("a","btn","View wishlist"); a.href = wu; a.target = "_blank"; a.rel = "noopener noreferrer"; pa.append(a); }
    if (helping && n.status === "pledged") { const b = el("button","btn soft","Cancel my offer"); b.type="button"; b.addEventListener("click", () => cancelHelp(n)); pa.append(b); }
    if (mine && n.status === "pledged") { const b = el("button","btn go","I got it, thank you"); b.type="button"; b.addEventListener("click", () => markDone(n)); pa.append(b); }
    if (mine && n.status === "open") { const b = el("button","btn soft","Remove post"); b.type="button"; b.addEventListener("click", () => removeNeed(n)); pa.append(b); }
    if (!mine && state.isOwner && n.example) { const b = el("button","btn soft","Delete example"); b.type="button"; b.addEventListener("click", () => removeNeed(n, true)); pa.append(b); }
    if (pa.childElementCount) c.append(pa);
    return c;
  }

  function fill(box, list, emptyText){
    box.replaceChildren();
    if (!list.length) { box.append(el("div","box empty",emptyText)); return; }
    list.forEach(n => box.append(card(n)));
  }
  function renderAll(){
    renderStats(); renderCatFilters();
    const order = { open:0, pledged:1, done:2 };
    const v = visible().sort((a,b) => (order[a.status]-order[b.status]) || (b.createdAt - a.createdAt));
    fill($("#feed"), v, state.q ? "No needs match your search." : zipOk(myZip()) && state.range !== "all" ? "No needs near you yet. Try Anywhere, or post the first one." : "No needs posted yet. Be the first.");
    fill($("#mineFeed"), state.needs.filter(n => n.posterId === state.me), "You haven't posted a need.");
    fill($("#helpFeed"), state.needs.filter(n => n.helper && n.helper.id === state.me), "You haven't offered to help yet.");
  }

  function setTab(t){
    state.tab = t;
    ["needs","post","mine"].forEach(k => $("#view-" + k).hidden = k !== t);
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
    window.scrollTo(0,0);
  }
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab],[data-go]"); if (!t) return;
    e.preventDefault(); setTab(t.dataset.tab || t.dataset.go);
    if ((t.dataset.go) === "post") setTimeout(() => $("#f-title").focus(), 50);
  });
  document.querySelectorAll("[data-quick]").forEach(b => b.addEventListener("click", () => { setTab("post"); $("#f-cat").value = b.dataset.quick; setTimeout(() => $("#f-title").focus(), 50); }));
  document.querySelector(".logo").addEventListener("click", e => { e.preventDefault(); setTab("needs"); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["needs","post","mine"].includes(h)) setTab(h); });
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); if (state.tab !== "needs") setTab("needs"); renderAll(); });

  $("#zip").value = store.get("2fish-zip") || "";
  $("#zip").addEventListener("input", e => { const v = e.target.value.replace(/\D/g,"").slice(0,5); e.target.value = v; store.set("2fish-zip", v); if (!$("#f-zip").value) $("#f-zip").value = v; renderAll(); });
  document.querySelectorAll(".loc .chip").forEach(b => b.addEventListener("click", () => {
    state.range = b.dataset.range;
    document.querySelectorAll(".loc .chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderAll();
  }));

  CATS.forEach(c => { const o = el("option", null, c); o.value = c; $("#f-cat").append(o); });
  $("#f-zip").value = $("#zip").value;
  $("#f-wish").addEventListener("change", e => $("#f-wishurl").hidden = !e.target.checked);
  $("#f-inperson").addEventListener("change", e => $("#f-spot").hidden = !e.target.checked);
  $("#f-zip").addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,"").slice(0,5));
  $("#f-name").addEventListener("input", e => { store.set("2fish-name", e.target.value.trim()); setMeAvatar(); });
  $("#f-name").value = store.get("2fish-name") || "";
  function setMeAvatar(){ const n = $("#f-name").value.trim(); const a = $("#meAv"); a.textContent = n ? n.charAt(0).toUpperCase() : "?"; }
  setMeAvatar();

  $("#postForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#postErr"); err.textContent = "";
    const n = {
      title: $("#f-title").value.trim(), category: $("#f-cat").value, note: $("#f-note").value.trim(),
      zip: $("#f-zip").value.trim(), area: $("#f-area").value.trim(), name: $("#f-name").value.trim(),
      neededBy: $("#f-by").value || "", inPerson: $("#f-inperson").checked, spot: $("#f-inperson").checked ? $("#f-spot").value.trim() : "",
      wishUrl: $("#f-wish").checked ? $("#f-wishurl").value.trim() : "", status: "open", posterId: state.me, createdAt: Date.now(), example: false
    };
    if (!n.title) return err.textContent = "Add what you need, like \"Size 4 diapers\".";
    if (!zipOk(n.zip)) return err.textContent = "Enter a 5-digit ZIP so nearby neighbors can find your post.";
    if (!n.inPerson && !n.wishUrl) return err.textContent = "Choose at least one way to receive help.";
    if (n.inPerson && !n.spot) return err.textContent = "Add a public meeting spot, like a library or church lobby.";
    if ($("#f-wish").checked && !safeUrl(n.wishUrl)) return err.textContent = "Paste the full wishlist link, starting with https://";
    if (/\d+\s+\w+\s+(st|street|rd|road|ave|avenue|dr|drive|ln|lane|ct|court|blvd)\b/i.test(n.spot + " " + n.note)) return err.textContent = "That looks like a street address. Use a public spot instead to stay safe.";
    $("#postBtn").disabled = true;
    try {
      if (state.db) await state.db.collection("needs").add(n);
      else { state.needs.unshift({ ...n, id: "local-" + Date.now(), local: true }); renderAll(); }
      const keepName = $("#f-name").value;
      $("#postForm").reset(); $("#f-name").value = keepName; $("#f-zip").value = myZip(); $("#f-wishurl").hidden = true; $("#f-spot").hidden = false;
      toast("Posted. Neighbors near " + n.zip + " can see it now.");
      setTab("mine");
    } catch(ex) { err.textContent = writeError(ex); }
    finally { $("#postBtn").disabled = false; }
  });

  function writeError(ex){
        if (ex && ex.code === "quota_exceeded") return "The board is full right now. Try again after old posts are cleared.";
    return "That didn't go through. Check your connection and try again.";
  }

  let helpTarget = null;
  function openHelp(n){
    helpTarget = n; $("#helpErr").textContent = ""; $("#h-note").value = "";
    $("#helpWhat").textContent = n.title + " for " + (n.name || "a neighbor") + " in " + n.zip;
    const box = $("#helpOpts"); box.replaceChildren();
    const opts = [];
    if (n.inPerson) opts.push(["inperson", "I'll drop it off", "At " + (n.spot || "their public spot")]);
    if (safeUrl(n.wishUrl)) opts.push(["wishlist", "I'll buy from their wishlist", "The store ships it to them directly"]);
    opts.forEach(([v,t,d], i) => {
      const l = el("label","opt"); const r = document.createElement("input"); r.type="radio"; r.name="method"; r.value=v; r.id="m-"+v; if (i===0) r.checked = true;
      const txt = el("div"); txt.append(el("div", null, t)); const sm = el("div", null, d); sm.style.cssText = "font-size:13px;color:var(--muted)"; txt.append(sm);
      l.append(r, txt); box.append(l);
    });
    $("#helpDlg").showModal();
  }
  $("#helpCancel").addEventListener("click", () => $("#helpDlg").close());
  $("#helpForm").addEventListener("submit", async e => {
    e.preventDefault(); if (!helpTarget) return;
    const method = (document.querySelector('input[name="method"]:checked') || {}).value || "inperson";
    const helper = { id: state.me, method, note: $("#h-note").value.trim(), at: Date.now() };
    $("#helpConfirm").disabled = true;
    try {
      await updateNeed(helpTarget, { status: "pledged", helper });
      $("#helpDlg").close();
      toast(method === "wishlist" ? "Thank you! Open the wishlist to place the order." : "Thank you! Meet at the spot listed on the post.");
    } catch(ex) { $("#helpErr").textContent = writeError(ex); }
    finally { $("#helpConfirm").disabled = false; }
  });

  async function updateNeed(n, patch){
    if (state.db && !n.local) {
      if (patch.helper === null) { const fresh = { ...n, ...patch }; delete fresh.id; delete fresh.helper; delete fresh.local; await state.db.collection("needs").doc(n.id).set(fresh); }
      else await state.db.collection("needs").doc(n.id).update(patch);
    } else { Object.assign(n, patch); if (patch.helper === null) delete n.helper; renderAll(); }
  }
  async function cancelHelp(n){ try { await updateNeed(n, { status: "open", helper: null }); toast("Offer cancelled. The post is open again."); } catch(ex) { toast(writeError(ex)); } }
  async function markDone(n){ try { await updateNeed(n, { status: "done", doneAt: Date.now() }); toast("Marked received. So glad it came through."); } catch(ex) { toast(writeError(ex)); } }
  async function removeNeed(n, isExample){
    try {
      if (state.db && !n.local) await state.db.collection("needs").doc(n.id).delete();
      else { state.needs = state.needs.filter(x => x !== n); renderAll(); }
      toast(isExample ? "Example removed." : "Post removed.");
    } catch(ex) { toast(writeError(ex)); }
  }

  const startHash = location.hash.slice(1); setTab(["needs","post","mine"].includes(startHash) ? startHash : "needs");
  if (!zipOk(myZip())) { state.range = "all"; document.querySelectorAll(".loc .chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.range === "all"))); }
  state.needs = previewNeeds().map(n => ({ ...n, local: true }));
  banner("Preview mode: showing example posts. Connecting to the shared board…");
  renderAll();

  // The original prototype synced to a temporary hosted store here. That code is gone;
  // this file is kept only as a reference for the look, copy and flows.
})();
</script>
</body>
</html>
